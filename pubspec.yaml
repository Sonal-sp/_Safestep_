name: safestep
description: "SafeStep — Elderly Care App. Medicine reminders, SOS, medical history."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.4
  go_router: ^14.6.3
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.2
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.3.6
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.1
  fl_chart: ^1.2.0
  geolocator: ^14.0.2
  permission_handler: ^11.0.0
  flutter_map: ^7.0.2
  sensors_plus: ^7.0.0
  battery_plus: ^7.0.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  share_plus: ^12.0.2
  http: ^1.6.0
  flutter_polyline_points: ^2.1.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  freezed: ^2.5.7

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/images/

